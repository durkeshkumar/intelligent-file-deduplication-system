services:

  mysql:
    image: mysql:8.0
    container_name: file_deduplication_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: file_deduplication_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: file_deduplication_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: file_deduplication_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8010:8000"
    volumes:
      - file_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: file_deduplication_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - file_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery:celery_app",
        "worker",
        "--loglevel=info"
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: file_deduplication_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  file_storage: